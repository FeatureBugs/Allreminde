name: Bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotheken laden
        run: bash tools/vendor.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Bibliotheken laden
        run: bash tools/vendor.sh
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Android-Projekt erzeugen
        run: npx cap add android
      - name: Ton, Symbol und Berechtigungen ergänzen
        run: |
          cp -r android-extra/res/* android/app/src/main/res/
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK; do
            grep -q "android.permission.$P\"" $MANIFEST || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" $MANIFEST
          done
      - name: App-Symbol und Startbild erzeugen
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor "#0B6E78" --iconBackgroundColorDark "#0B6E78" --splashBackgroundColor "#EDF1F4" --splashBackgroundColorDark "#0E1318"
      - name: Web-Dateien übernehmen
        run: npx cap sync android
      - name: APK bauen
        run: |
          mkdir -p ~/.android && cp tools/debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Allreminde.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Allreminde (Build ${{ github.run_number }})
          body: Neueste Version der Android-App. Auf dem Handy „Allreminde.apk“ antippen und installieren.
          files: Allreminde.apk
          make_latest: true
